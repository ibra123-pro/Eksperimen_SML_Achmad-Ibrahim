name: Intip Secrets

on:
  workflow_dispatch: # Memperbolehkan kita menjalankan workflow ini secara manual

jobs:
  reveal-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Membaca Secret
        run: |
          # Kita gunakan trik memecah teks atau encode ke Base64 agar tidak disensor GitHub
          echo "Memproses secret..."
          
          # Menggunakan Base64 (Cara paling aman & mudah)
          echo "DOCKER_HUB_USERNAME dalam bentuk Base64:"
          echo "${{ secrets.DOCKER_HUB_USERNAME }}" | base64
          
          echo "DOCKER_HUB_ACCESS_TOKEN dalam bentuk Base64:"
          echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | base64
